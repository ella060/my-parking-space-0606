<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的停车位</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="rain">
    <main class="app-shell" aria-live="polite">
      <section class="screen screen-home is-active" id="homeScreen" aria-labelledby="homeTitle">
        <div class="home-topbar">
          <div>
            <p class="overline">PRIVATE PARKING SPACE</p>
            <h1 id="homeTitle">我的停车位</h1>
          </div>
          <div class="status-pill" id="homeClock">22:18</div>
        </div>

        <div class="parking-scene" aria-label="夜晚停车位里的小集装箱房间">
          <div class="cityline">
            <span class="tower tower-a"></span>
            <span class="tower tower-b"></span>
            <span class="tower tower-c"></span>
            <span class="tower tower-d"></span>
          </div>
          <div class="parking-ground">
            <span class="parking-line line-left"></span>
            <span class="parking-line line-right"></span>
            <span class="parking-line line-front"></span>
          </div>
          <div class="container-home">
            <div class="cabin-roof"></div>
            <div class="cabin-body">
              <span class="cabin-window"></span>
              <span class="cabin-door"></span>
              <span class="cabin-light"></span>
              <span class="cabin-step"></span>
            </div>
          </div>
          <div class="soft-rain" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="home-copy">
          <p id="welcomeLine">今晚可以慢一点。这里没有人催你解释清楚。</p>
        </div>

        <div class="mood-strip" role="listbox" aria-label="选择现在的状态">
          <button class="mood-chip is-selected" type="button" data-mood="tired">我很累</button>
          <button class="mood-chip" type="button" data-mood="quiet">我需要安静</button>
          <button class="mood-chip" type="button" data-mood="blank">想发呆</button>
          <button class="mood-chip" type="button" data-mood="write">想写点什么</button>
          <button class="mood-chip" type="button" data-mood="talk">想有人陪</button>
        </div>

        <button class="primary-action" type="button" id="enterSpace">回到我的空间</button>
      </section>

      <section class="screen screen-space" id="spaceScreen" aria-labelledby="spaceTitle">
        <header class="space-header">
          <button class="ghost-action" type="button" id="backHome">车位</button>
          <div>
            <p class="overline" id="themeLabel">雨夜车位</p>
            <h2 id="spaceTitle">你的小屋亮着灯</h2>
          </div>
          <button class="ghost-action" type="button" id="leaveSpace">离开</button>
        </header>

        <div class="room-scene" id="roomScene" aria-label="线上私人小屋">
          <div class="room-backdrop">
            <span class="wall-light"></span>
            <span class="window-view"></span>
            <span class="projector-glow"></span>
          </div>
          <button class="room-object window-object" type="button" data-mode="daze" aria-label="打开窗边发呆模式"></button>
          <button class="room-object lamp-object is-on" type="button" id="lampToggle" aria-label="切换桌灯"></button>
          <button class="room-object couch-object" type="button" data-mode="chat" aria-label="坐到沙发旁倾诉"></button>
          <button class="room-object diary-object" type="button" data-mode="journal" aria-label="打开日记本"></button>
          <button class="room-object speaker-object" type="button" data-mode="daze" aria-label="打开白噪音"></button>
          <button class="room-object storage-object" type="button" data-mode="keepsake" aria-label="打开储物箱"></button>
          <button class="room-object projector-object" type="button" data-mode="focus" aria-label="打开轻量计时"></button>
        </div>

        <nav class="mode-dock" aria-label="空间功能">
          <button type="button" data-mode="daze">发呆</button>
          <button type="button" data-mode="chat">倾诉</button>
          <button type="button" data-mode="journal">日记</button>
          <button type="button" data-mode="focus">停一会</button>
          <button type="button" data-mode="decorate">布置</button>
        </nav>
      </section>

      <section class="screen screen-exit" id="exitScreen" aria-labelledby="exitTitle">
        <div class="exit-scene">
          <div class="closed-cabin">
            <span></span>
          </div>
        </div>
        <p class="overline">WELCOME BACK ANYTIME</p>
        <h2 id="exitTitle">车位已经替你留着</h2>
        <p id="exitSummary">你刚刚在这里待了一会儿，什么都不用证明。</p>
        <button class="primary-action" type="button" id="returnHome">回到入口</button>
      </section>
    </main>

    <aside class="mode-panel" id="modePanel" aria-hidden="true">
      <div class="panel-sheet" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
        <div class="panel-grip" aria-hidden="true"></div>
        <header class="panel-header">
          <div>
            <p class="overline" id="panelKicker">PRIVATE MODE</p>
            <h2 id="panelTitle">发呆</h2>
          </div>
          <button class="ghost-action" type="button" id="closePanel">收起</button>
        </header>
        <div class="panel-content" id="panelContent"></div>
      </div>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
